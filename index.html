<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cameron Dunn</title>
    <!-- The 3D flythrough lives at /world now, not the site root — this is
         a real static redirect (a genuine /world/index.html file, not a
         client-side route), since GitHub Pages can't run a history-API SPA
         router: an arbitrary deep link like /world with no matching file
         just 404s there. A meta-refresh plus a JS fallback covers browsers
         either way, and redirects instantly (content="0"). -->
    <meta http-equiv="refresh" content="0; url=/world/" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; }
    </style>
  </head>
  <body>
    <script>location.replace('/world/');</script>
  </body>
</html>
