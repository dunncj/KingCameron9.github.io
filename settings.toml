# Centralized defaults for the whole app — loaded once at startup into a
# live, mutable tree (see src/settings/store.ts). Every table/key name here
# is a plain identifier (no spaces), so any of them works as a dot path with
# the ":settings" console command, e.g. `settings set stars.brightness 100`.
# Edit this file and reload to change a default; edit a value live instead
# via the dev GUI or the console, then `settings export` to copy the live
# tree back out in this same format to make a tweak permanent.

[sky]
hour = 12
turbidity = 3
rayleigh = 0.15
mieCoefficient = 0.005
mieDirectionalG = 0.45

[stars]
density = 0.85
brightness = 3.5

[clouds]
coverage = 0.25
density = 0.5
scale = 0.0006
speed = 0.00015
formation = "puffy"
levels = 1

[rain]
enabled = false
intensity = 1

[snow]
enabled = false
intensity = 1

[wind]
speed = 15
direction = 45
streakBlur = 0.08

[wind.shake]
enabled = true
amount = 0.6

[storm]
enabled = false

[postfx]
exposure = 0.55
bloomStrength = 0.35
bloomRadius = 1.3
bloomThreshold = 0.9
godRayStrength = 0.35
vignette = 0.35
zoomBlurStrength = 0.55

[pixelArt]
pixelSize = 3
normalEdgeStrength = 0
depthEdgeStrength = 0

[camera.move]
speed = 150

[camera.bob]
enabled = true
pattern = "Figure8"
periodSeconds = 20
amount = 6
idleAmount = 1.4

[camera.scroll]
sensitivity = 2.2
damping = 6
maxSpeed = 1500
minDistance = 50
maxDistance = 3000
exitOverscroll = 400

[transitions.handoff]
startHeight = 500
descendDuration = 1.2

[transitions.flyIn]
zoom = 18
ms = 2200
panMs = 700

[transitions.movements.panIn]
curve = "hyperbolic-out"
speed = 1
sharpness = 24

[transitions.movements.zoomIn]
curve = "hyperbolic-in"
speed = 1
sharpness = 24

[transitions.movements.zoomOut]
curve = "hyperbolic-out"
speed = 1
sharpness = 24

[transitions.movements.panOut]
curve = "hyperbolic-in"
speed = 2
sharpness = 45

[prefetch.dest.highRes]
radius = 0
zoomDrop = 0

[prefetch.dest.medRes]
radius = 2
zoomDrop = 2

[prefetch.dest.lowRes]
radius = 2
zoomDrop = 5

[prefetch.dest.veryLowRes]
radius = 1
zoomDrop = 8

[prefetch.dest]
edgeFadeStrength = 0.6
fetchBatchSize = 6
buildBatchSize = 4

[prefetch.heavy]
resolutionScale = 0.35
wideResW = 320
wideResH = 180
durationMs = 15000
staggerMs = 120

[prefetch.hover]
radiusPx = 90
debounceMs = 150

[preload]
clickBackoffMs = 750
idleDelayMs = 4000
idleIntervalMs = 6000
maxConcurrentHeavy = 2
heavyCooldownMs = 20000

# --- Cache & preload quality ---------------------------------------------
# One named tier bundles every knob above (plus the 3D-tiles LRU cache,
# which isn't its own settings table — see src/cache/quality.ts) into a
# single "how aggressively should this site cache/preload" dial. `quality`
# picks which tier is active on load; switching it at runtime (the ":cache
# quality <name>" console command, or the dev GUI) re-applies that tier's
# numbers onto the live [prefetch.*]/[preload] tables above, the same way
# a weather preset re-applies onto [clouds]/[wind]/etc.
#
# [cache.qualities.high]'s own values are deliberately identical to
# [prefetch.*]/[preload] above (high is the shipped default — nothing to
# apply on a normal load) and to tiles.js's own hardcoded fallback
# constants (belt-and-suspenders: the site still behaves the same even if
# something went wrong loading settings.toml). low/medium/epic scale every
# knob from there — smaller/looser for low (leaner network & memory use),
# larger/tighter for epic ("epic" as in the classic game-graphics-settings
# ladder: low/medium/high/epic).
[cache]
quality = "high"

[cache.qualities.low]
clickBackoffMs = 750
idleDelayMs = 8000
idleIntervalMs = 12000
maxConcurrentHeavy = 1
heavyCooldownMs = 40000
heavyResolutionScale = 0.18
heavyWideResW = 160
heavyWideResH = 90
heavyDurationMs = 8000
heavyStaggerMs = 250
hoverRadiusPx = 60
hoverDebounceMs = 250
destHighRes = { radius = 0, zoomDrop = 0 }
destMedRes = { radius = 1, zoomDrop = 4 }
destLowRes = { radius = 1, zoomDrop = 7 }
destVeryLowRes = { radius = 0, zoomDrop = 0 }
destEdgeFadeStrength = 0.5
destFetchBatchSize = 3
destBuildBatchSize = 2
tilesMaxSizeMB = 150
tilesMaxItems = 1500
tilesErrorTarget = 28

[cache.qualities.medium]
clickBackoffMs = 750
idleDelayMs = 5000
idleIntervalMs = 8000
maxConcurrentHeavy = 2
heavyCooldownMs = 28000
heavyResolutionScale = 0.26
heavyWideResW = 240
heavyWideResH = 135
heavyDurationMs = 11000
heavyStaggerMs = 180
hoverRadiusPx = 75
hoverDebounceMs = 200
destHighRes = { radius = 0, zoomDrop = 0 }
destMedRes = { radius = 1, zoomDrop = 3 }
destLowRes = { radius = 2, zoomDrop = 6 }
destVeryLowRes = { radius = 1, zoomDrop = 8 }
destEdgeFadeStrength = 0.55
destFetchBatchSize = 4
destBuildBatchSize = 3
tilesMaxSizeMB = 260
tilesMaxItems = 2600
tilesErrorTarget = 20

[cache.qualities.high]
clickBackoffMs = 750
idleDelayMs = 4000
idleIntervalMs = 6000
maxConcurrentHeavy = 2
heavyCooldownMs = 20000
heavyResolutionScale = 0.35
heavyWideResW = 320
heavyWideResH = 180
heavyDurationMs = 15000
heavyStaggerMs = 120
hoverRadiusPx = 90
hoverDebounceMs = 150
destHighRes = { radius = 0, zoomDrop = 0 }
destMedRes = { radius = 2, zoomDrop = 2 }
destLowRes = { radius = 2, zoomDrop = 5 }
destVeryLowRes = { radius = 1, zoomDrop = 8 }
destEdgeFadeStrength = 0.6
destFetchBatchSize = 6
destBuildBatchSize = 4
tilesMaxSizeMB = 400
tilesMaxItems = 4000
tilesErrorTarget = 16

[cache.qualities.epic]
clickBackoffMs = 600
idleDelayMs = 2500
idleIntervalMs = 4000
maxConcurrentHeavy = 4
heavyCooldownMs = 12000
heavyResolutionScale = 0.55
heavyWideResW = 480
heavyWideResH = 270
heavyDurationMs = 20000
heavyStaggerMs = 80
hoverRadiusPx = 120
hoverDebounceMs = 100
destHighRes = { radius = 1, zoomDrop = 0 }
destMedRes = { radius = 2, zoomDrop = 1 }
destLowRes = { radius = 3, zoomDrop = 4 }
destVeryLowRes = { radius = 2, zoomDrop = 7 }
destEdgeFadeStrength = 0.7
destFetchBatchSize = 10
destBuildBatchSize = 6
tilesMaxSizeMB = 800
tilesMaxItems = 7000
tilesErrorTarget = 10

# --- Locations ---------------------------------------------------------
# position/target are local coordinates only meaningful once the 3D tiles
# are re-centered at this location's own lat/lon (see tiles.teleport) —
# see main.js's own comments on PALO_ALTO_VIEW/URBANA_VIEW/etc for how each
# one was derived. nightBrightness scales how bright stars/moon read at
# this location — real light pollution varies a lot by where you are.

[locations.paloAlto]
